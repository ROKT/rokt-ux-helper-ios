name: Run unit tests
description: Action runs `xcodebuild test`

# Toolchain config lives in the CI_* repo variables (the caller passes them in as
# inputs, since `vars` isn't readable inside a composite action).

inputs:
  codecov-token:
    description: Codecov token
    required: false
  xcode-version:
    description: Wired from repo variable CI_XCODE_VERSION by the caller workflow.
    required: true
  simulator-model:
    description: Wired from repo variable CI_SIMULATOR_MODEL by the caller workflow.
    required: true
  simulator-os:
    description: Wired from repo variable CI_SIMULATOR_OS by the caller workflow.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Setup iOS Simulator
      uses: futureware-tech/simulator-action@dab10d813144ef59b48d401cd95da151222ef8cd # v4
      id: simulator
      with:
        model: ${{ inputs.simulator-model }}
        os: iOS
        # Pinned OS (not a range) so snapshot rendering is deterministic; bumping it
        # requires re-recording snapshots.
        os_version: ${{ inputs.simulator-os }}
        wait_for_boot: true
        shutdown_after_job: true

    - name: Run unit tests
      env:
        TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshot-failures
      run: >
        set -o pipefail &&
        xcodebuild -skipPackagePluginValidation -scheme RoktUXHelper
        -destination 'id=${{ steps.simulator.outputs.udid }}'
        -enableCodeCoverage YES -derivedDataPath DerivedData clean build test
        | xcbeautify --renderer github-actions
      shell: bash

    - name: Upload snapshot failure diffs
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: snapshot-failures
        path: snapshot-failures/
        if-no-files-found: warn

    # Coverage post-processing (below) reads the .xcresult bundle that xcodebuild
    # writes asynchronously in the background. Xcode's own log ('...log hasn't
    # finished recording after waiting 30 seconds') shows this write can still be
    # in flight once the test step above has already exited 0. Tests have already
    # passed or failed by that point, so a coverage-extraction or upload failure
    # here is marked continue-on-error: it must never flip a green test run red.
    # A real test failure is unaffected: it fails the untouched "Run unit tests"
    # step above, which has no continue-on-error and still fails the job.
    - name: Install xcresultparser
      if: ${{ inputs.codecov-token != '' }}
      continue-on-error: true
      run: brew install xcresultparser
      shell: bash

    - name: Process coverage report
      if: ${{ inputs.codecov-token != '' }}
      id: process-coverage
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p artifacts
        xcresultparser --output-format cobertura "$(find DerivedData/Logs/Test -name '*.xcresult' | head -n 1)" --project-root "$(pwd)" > "artifacts/coverage.xml"

    - name: Upload coverage report
      if: ${{ inputs.codecov-token != '' && steps.process-coverage.outcome == 'success' }}
      id: upload-coverage
      continue-on-error: true
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        token: ${{ inputs.codecov-token }}
        files: ./artifacts/coverage.xml
        flags: unittests

    - name: Warn on coverage post-processing failure
      if: >-
        ${{ inputs.codecov-token != '' &&
            (steps.process-coverage.outcome == 'failure' ||
             steps.upload-coverage.outcome == 'failure') }}
      shell: bash
      run: |
        echo "::warning::Coverage report generation or upload failed after the test step already completed. Test results are unaffected; see the earlier step logs for details."
