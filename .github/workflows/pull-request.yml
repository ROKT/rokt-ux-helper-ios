# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Pull Request

permissions:
  contents: read
  pull-requests: read
  id-token: write

on:
  # workflow_dispatch keeps an on-demand whole-repo Trunk scan available now that
  # the PR gate only checks the diff (the action autodetects check-mode all here).
  workflow_dispatch:
  push:
    branches:
      - main
      - maintenance/*
  pull_request:

jobs:
  trunk-check:
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    permissions:
      contents: read
      # Diff-scoped mode posts findings as PR annotations via the Checks API.
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-mode is deliberately unset: the action then autodetects
      # pull_request (diff vs the base sha) on PRs, push on branch pushes and
      # all on workflow_dispatch.
      - name: Trunk Check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  podspec-lint:
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint podspec
        run: pod lib lint RoktUXHelper.podspec --allow-warnings --verbose

  unit-test:
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Packages
        run: swift package resolve --verbose

      - name: Install xcbeautify
        run: |
          brew list xcbeautify || brew install xcbeautify

      - name: Run unit tests
        uses: ./.github/composite_actions/run_xcodebuild_tests
        timeout-minutes: 15
        with:
          xcode-version: ${{ vars.CI_XCODE_VERSION }}
          simulator-model: ${{ vars.CI_SIMULATOR_MODEL }}
          simulator-os: ${{ vars.CI_SIMULATOR_OS }}

  coverage-comment:
    name: Coverage comment
    needs: [unit-test]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: coverage-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Download coverage summary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
          path: coverage-summary

      - name: Check current PR head
        id: current
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          head_sha=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [[ "$head_sha" == "$EXPECTED_HEAD" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find coverage comment
        id: fc
        if: steps.current.outputs.current == 'true'
        continue-on-error: true
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- ux-helper-coverage-report -->

      - name: Create or update coverage comment
        if: steps.fc.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: coverage-summary/coverage.md

  frame-budget:
    name: Frame Budget
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ vars.CI_XCODE_VERSION }}

      - name: Install xcbeautify
        run: brew list xcbeautify || brew install xcbeautify

      - name: Run frame_budget.py unit tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      # A generic device destination, so nothing has to be booted or signed: the check reads frame
      # sizes out of the compiled object and never runs it. It is also arm64 whatever the runner
      # is, which a simulator build is not. Debug on purpose — at -Onone every local gets its own
      # slot, which is the worst case and what a partner debugging an integration runs.
      - name: Build for measurement
        run: >
          set -o pipefail &&
          xcodebuild -skipPackagePluginValidation -scheme RoktUXHelper
          -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData build
          | xcbeautify --renderer github-actions

      - name: Check frame budget
        run: tools/frame_budget.py DerivedData/Build/Products/Debug-iphoneos/RoktUXHelper.o

  size-report:
    if: github.event_name == 'pull_request'
    name: Size Report
    uses: ./.github/workflows/ci-size-report.yml
    permissions:
      contents: read
      pull-requests: write

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    needs: [trunk-check, unit-test, podspec-lint, frame-budget]
    name: Notify GChat
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@1859338d7c2c2b873233505c751acbf09fb218d5 # main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_MOBILE_INTEGRATION_CHANNEL_WEBHOOK }}
