# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Pull Request

permissions:
  contents: read
  pull-requests: read
  id-token: write

on:
  # workflow_dispatch keeps an on-demand whole-repo Trunk scan available now that
  # the PR gate only checks the diff (the action autodetects check-mode all here).
  workflow_dispatch:
  push:
    branches:
      - main
      - maintenance/*
  pull_request:

jobs:
  trunk-check:
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    permissions:
      contents: read
      # Diff-scoped mode posts findings as PR annotations via the Checks API.
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-mode is deliberately unset: the action then autodetects
      # pull_request (diff vs the base sha) on PRs, push on branch pushes and
      # all on workflow_dispatch.
      - name: Trunk Check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  podspec-lint:
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint podspec
        run: pod lib lint RoktUXHelper.podspec --allow-warnings --verbose

  unit-test:
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Packages
        run: swift package resolve --verbose

      - name: Install xcbeautify
        run: |
          brew list xcbeautify || brew install xcbeautify

      - name: Run unit tests
        uses: ./.github/composite_actions/run_xcodebuild_tests
        timeout-minutes: 15
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          xcode-version: ${{ vars.CI_XCODE_VERSION }}
          simulator-model: ${{ vars.CI_SIMULATOR_MODEL }}
          simulator-os: ${{ vars.CI_SIMULATOR_OS }}

  frame-budget:
    name: Frame Budget
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ vars.CI_XCODE_VERSION }}

      - name: Install xcbeautify
        run: brew list xcbeautify || brew install xcbeautify

      # A generic destination, so no simulator has to be booted: the check reads frame sizes out
      # of the compiled object and never runs it. Debug on purpose — at -Onone every local gets
      # its own slot, which is the worst case and what a partner debugging an integration runs.
      - name: Build for measurement
        run: >
          set -o pipefail &&
          xcodebuild -skipPackagePluginValidation -scheme RoktUXHelper
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData build
          | xcbeautify --renderer github-actions

      - name: Check frame budget
        run: tools/frame_budget.py DerivedData/Build/Products/Debug-iphonesimulator/RoktUXHelper.o

  size-report:
    if: github.event_name == 'pull_request'
    name: Size Report
    uses: ./.github/workflows/ci-size-report.yml
    permissions:
      contents: read
      pull-requests: write

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    needs: [trunk-check, unit-test, podspec-lint]
    name: Notify GChat
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@1859338d7c2c2b873233505c751acbf09fb218d5 # main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_MOBILE_INTEGRATION_CHANNEL_WEBHOOK }}
